<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>videotool · 视频诊断与压缩</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1b2029; --line:#252c39;
    --fg:#e7eaf0; --muted:#8b94a7; --accent:#4f8cff; --accent2:#6ea8ff;
    --ok:#34c759; --warn:#f0b429; --danger:#e5534b; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -20%, #1a2233 0%, var(--bg) 55%) no-repeat, var(--bg);
    color:var(--fg); font:14px/1.6 "Segoe UI", "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
    min-height:100vh; padding:28px 18px 80px;
  }
  .wrap{max-width:960px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  header h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12.5px}
  .badge{
    margin-left:auto;display:inline-flex;align-items:center;gap:7px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;font-size:12px;color:var(--muted)
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(52,199,89,.7)}
  .dot.bad{background:var(--danger)}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:16px
  }
  .card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 14px;
    text-transform:uppercase;letter-spacing:1.2px}
  .hidden{display:none !important}

  /* 选择文件 */
  .drop{
    border:1.5px dashed #33405a;border-radius:12px;padding:30px 20px;text-align:center;
    cursor:pointer;transition:.15s;background:rgba(79,140,255,.03)
  }
  .drop:hover,.drop.hot{border-color:var(--accent);background:rgba(79,140,255,.09)}
  .drop strong{display:block;font-size:15px;margin-bottom:6px}
  .drop span{color:var(--muted);font-size:12.5px}
  .pathrow{display:flex;gap:8px;margin-top:14px;align-items:center}
  .pathrow .hint{color:var(--muted);font-size:12px;white-space:nowrap}
  input[type=text],input[type=number],select{
    background:#0e1219;border:1px solid var(--line);color:var(--fg);
    border-radius:9px;padding:9px 11px;font:inherit;outline:none;width:100%
  }
  input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
  button{
    font:inherit;border-radius:9px;border:1px solid var(--line);background:#202836;color:var(--fg);
    padding:9px 16px;cursor:pointer;transition:.15s;white-space:nowrap
  }
  button:hover:not(:disabled){background:#27303f;border-color:#364258}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:var(--accent2);border-color:var(--accent2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .ghost{background:transparent}
  .upl{margin-top:12px;height:6px;border-radius:99px;background:#0e1219;overflow:hidden}
  .upl i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .upltxt{font-size:12px;color:var(--muted);margin-top:6px}

  /* 分析 */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
  .kpi{background:#0e1219;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .kpi b{display:block;font-size:16px;font-weight:600;letter-spacing:.2px}
  .kpi i{font-style:normal;font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
  .kpi small{color:var(--muted);font-size:11.5px}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #1e2431}
  th{color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
  td.num{font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;background:#1e2736;font-size:11.5px;color:#a9b4c8}
  .pill.video{background:rgba(79,140,255,.16);color:#91b8ff}
  .pill.audio{background:rgba(52,199,89,.15);color:#7fe3a2}
  .note{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .note div{
    background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.22);
    color:#e8c877;border-radius:9px;padding:8px 12px;font-size:12.8px
  }
  .note div.info{background:rgba(79,140,255,.07);border-color:rgba(79,140,255,.22);color:#a8c4ff}

  /* 操作 */
  .tabs{display:flex;gap:6px;background:#0e1219;border:1px solid var(--line);
    border-radius:11px;padding:4px;width:fit-content;margin-bottom:18px}
  .tabs button{border:none;background:transparent;padding:7px 18px;border-radius:8px;color:var(--muted)}
  .tabs button.on{background:#243040;color:var(--fg);font-weight:600}
  .form{display:grid;grid-template-columns:130px 1fr;gap:11px 14px;align-items:center}
  .form > label{color:var(--muted);font-size:12.8px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;gap:6px;background:#0e1219;border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{border:none;background:transparent;padding:6px 14px;border-radius:7px;color:var(--muted);font-size:13px}
  .seg button.on{background:#243040;color:var(--fg)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .unit{color:var(--muted);font-size:12.5px}
  .outpath{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);
    word-break:break-all;background:#0b0e14;border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
  .actions{display:flex;gap:10px;align-items:center;margin-top:18px}
  .checkbox{display:inline-flex;align-items:center;gap:7px;color:var(--fg);font-size:13px;cursor:pointer}
  .checkbox input{accent-color:var(--accent);width:15px;height:15px}

  /* 任务 */
  .bar{height:9px;border-radius:99px;background:#0b0e14;overflow:hidden;margin:6px 0 8px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d7bf5,#6ea8ff);transition:width .4s}
  .bar.done i{background:linear-gradient(90deg,#2aa84f,#4fd27a)}
  .bar.err i{background:var(--danger)}
  .stat{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .stat b{color:var(--fg);font-weight:600}
  pre.log{
    margin:14px 0 0;background:#0a0d12;border:1px solid #1b2230;border-radius:10px;
    padding:12px;max-height:200px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;
    color:#9aa7bd;white-space:pre-wrap;word-break:break-all
  }
  .result{display:flex;gap:18px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .sizes{display:flex;gap:14px;align-items:baseline;font-variant-numeric:tabular-nums}
  .sizes .old{color:var(--muted);text-decoration:line-through}
  .sizes .arrow{color:var(--muted)}
  .sizes .new{font-size:22px;font-weight:700;color:#8ee9a8}
  .saved{background:rgba(52,199,89,.14);color:#8ee9a8;border-radius:99px;padding:2px 10px;font-size:12.5px}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2a1f1f;border:1px solid #5a2f2f;color:#ffb3ae;padding:10px 18px;border-radius:10px;
    opacity:0;pointer-events:none;transition:.25s;font-size:13px;max-width:80vw
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{text-align:center;color:#5b6478;font-size:12px;margin-top:26px}
  code{background:#0b0e14;padding:1px 6px;border-radius:5px;font-size:12px;color:#9fb4d8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>videotool</h1>
    <span class="sub">视频体积诊断 · 无损提取 · 重新编码</span>
    <span class="badge"><span class="dot" id="ffdot"></span><span id="fftext">检测 ffmpeg…</span></span>
  </header>

  <!-- 1 选择 -->
  <section class="card">
    <h2>1 · 选择视频</h2>
    <div class="drop" id="drop">
      <strong>把视频拖到这里，或点击选择</strong>
      <span>文件只在本机处理，不会上传到任何服务器</span>
    </div>
    <input type="file" id="file" accept="video/*,.mp4,.mov,.m4v" class="hidden">
    <div class="upl hidden" id="upl"><i></i></div>
    <div class="upltxt hidden" id="upltxt"></div>
    <div class="pathrow">
      <span class="hint">或者直接填路径</span>
      <input type="text" id="path" placeholder="C:\Users\you\Videos\clip.mp4">
      <button id="loadpath">分析</button>
    </div>
  </section>

  <!-- 2 分析 -->
  <section class="card hidden" id="infoCard">
    <h2>2 · 文件诊断</h2>
    <div class="grid" id="kpis"></div>
    <table id="tracks"></table>
    <div class="note" id="notes"></div>
  </section>

  <!-- 3 操作 -->
  <section class="card hidden" id="actCard">
    <h2>3 · 处理</h2>
    <div class="tabs">
      <button class="on" data-tab="shrink">压缩</button>
      <button data-tab="extract">无损提取</button>
    </div>

    <div id="panelShrink">
      <div class="form">
        <label>压缩方式</label>
        <div class="seg" id="modeSeg">
          <button class="on" data-mode="size">限制体积</button>
          <button data-mode="crf">限制画质</button>
        </div>

        <label id="sizeLabel">目标体积</label>
        <div class="row" id="sizeRow">
          <input type="number" id="targetMb" value="20" min="0.5" max="4096" step="1" style="width:110px">
          <span class="unit">MB</span>
          <span class="unit" id="quickWrap"></span>
        </div>

        <label id="crfLabel" class="hidden">画质 CRF</label>
        <div class="row hidden" id="crfRow">
          <input type="range" id="crf" min="16" max="32" step="1" value="23" style="max-width:320px">
          <b id="crfVal">23</b>
          <span class="unit" id="crfHint">越小越清晰、体积越大</span>
        </div>

        <label>编码器</label>
        <div class="row">
          <select id="codec" style="width:220px">
            <option value="h264">H.264（兼容性最好）</option>
            <option value="hevc">H.265 / HEVC（同画质更小）</option>
          </select>
          <select id="preset" style="width:170px">
            <option value="veryfast">速度快</option>
            <option value="fast">较快</option>
            <option value="medium">较慢但更省</option>
          </select>
        </div>

        <label>分辨率</label>
        <select id="height" style="width:220px">
          <option value="0">保持原样</option>
          <option value="1920">缩到高 1920</option>
          <option value="1440">缩到高 1440</option>
          <option value="1080">缩到高 1080</option>
          <option value="720">缩到高 720</option>
        </select>

        <label>音频</label>
        <div class="row">
          <select id="audioKbps" style="width:150px">
            <option value="32">32 kbps</option>
            <option value="64">64 kbps</option>
            <option value="96">96 kbps</option>
            <option value="128" selected>128 kbps</option>
            <option value="192">192 kbps</option>
          </select>
          <label class="checkbox"><input type="checkbox" id="noAudio"> 去掉音轨</label>
        </div>
      </div>
    </div>

    <div id="panelExtract" class="hidden">
      <p style="color:var(--muted);margin:0 0 14px">
        只重组容器、<b>不重新编码</b>，画质零损失，体积也几乎不变。适合修复 <code>moov</code>
        在文件尾部（网页拖动会卡）或想换封装格式的情况。
      </p>
      <label class="checkbox"><input type="checkbox" id="extractNoAudio"> 顺便去掉音轨</label>
    </div>

    <div class="form" style="margin-top:14px">
      <label>输出目录</label>
      <input type="text" id="outDirInput" value="out" placeholder="默认 out，可填任意目录如 D:\Videos\out">
    </div>

    <div class="outpath" id="outPreview" style="margin-top:12px">输出：out\…</div>
    <div class="actions">
      <button class="primary" id="start">开始处理</button>
      <span class="unit" id="startHint"></span>
    </div>
  </section>

  <!-- 4 任务 -->
  <section class="card hidden" id="jobCard">
    <h2 id="jobTitle">处理中</h2>
    <div class="bar" id="bar"><i></i></div>
    <div class="stat" id="jobStat"></div>
    <div class="result hidden" id="resultBox"></div>
    <pre class="log" id="jobLog"></pre>
    <div class="actions">
      <button id="cancel" class="ghost">取消</button>
      <button id="again" class="ghost hidden">再处理一次</button>
    </div>
  </section>

  <footer>只监听 127.0.0.1 · 任务在本机运行 · 默认输出目录 <span id="outdir"></span></footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let current = null;       // 当前分析结果
let jobId = null;
let timer = null;

/* ---------- 工具 ---------- */
function fmtBytes(n){
  if(n == null) return "—";
  const u = ["B","KB","MB","GB"]; let i = 0, v = n;
  while(v >= 1024 && i < u.length-1){ v /= 1024; i++; }
  return (i === 0 ? v.toFixed(0) : v.toFixed(2)) + " " + u[i];
}
function fmtDur(s){
  if(s == null) return "—";
  const m = Math.floor(s/60), r = s - m*60;
  return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1);
}
function fmtBps(b){
  if(!b) return "—";
  return b >= 1e6 ? (b/1e6).toFixed(2) + " Mbps" : Math.round(b/1e3) + " kbps";
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 4200);
}
async function api(url, body){
  const opt = body ? {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)} : {};
  const r = await fetch(url, opt);
  let data = {};
  try { data = await r.json(); } catch(e){}
  if(!r.ok || data.ok === false) throw new Error(data.error || ("请求失败 " + r.status));
  return data;
}

/* ---------- 状态 ---------- */
(async function init(){
  try{
    const s = await api("/api/state");
    $("ffdot").className = "dot " + (s.ffmpeg.ok ? "ok" : "bad");
    $("fftext").textContent = s.ffmpeg.ok
      ? (s.ffmpeg.version || "ffmpeg 就绪").replace(/^ffmpeg version\s*/i, "ffmpeg ")
      : "未找到 ffmpeg";
    $("outdir").textContent = s.out_dir;
    if(s.out_dir) $("outDirInput").value = s.out_dir;
  }catch(e){ $("fftext").textContent = "服务未连接"; }
  $("quickWrap").innerHTML = [10,20,50,100].map(v =>
    `<button class="ghost" style="padding:3px 9px;font-size:12px" onclick="setMb(${v})">${v}MB</button>`).join(" ");

  // 支持 ?path=<文件路径> 直接进入分析（方便收藏或从命令行打开）
  const pre = new URLSearchParams(location.search).get("path");
  if(pre){ $("path").value = pre; analyze(pre); }
})();

window.setMb = (v) => { $("targetMb").value = v; updatePreview(); };

/* ---------- 选择文件 ---------- */
const drop = $("drop"), fileInput = $("file");
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("hot"); });
drop.addEventListener("dragleave", () => drop.classList.remove("hot"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("hot");
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => { if(fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file){
  if(file.size > 8 * 1024 * 1024 * 1024){ toast("文件太大（>8GB），请直接填路径"); return; }
  const up = $("upl"), txt = $("upltxt");
  up.classList.remove("hidden"); txt.classList.remove("hidden");
  txt.textContent = `正在读取 ${file.name}（${fmtBytes(file.size)}）…`;
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload?name=" + encodeURIComponent(file.name));
  xhr.upload.onprogress = (e) => {
    if(!e.lengthComputable) return;
    const p = e.loaded / e.total * 100;
    up.firstElementChild.style.width = p.toFixed(1) + "%";
    txt.textContent = `已传输 ${fmtBytes(e.loaded)} / ${fmtBytes(e.total)}（${p.toFixed(0)}%）`;
  };
  xhr.onload = () => {
    up.classList.add("hidden"); txt.classList.add("hidden");
    try{
      const d = JSON.parse(xhr.responseText);
      if(xhr.status !== 200 || d.ok === false) throw new Error(d.error || "上传失败");
      $("path").value = d.path;
      analyze(d.path);
    }catch(err){ toast(err.message); }
  };
  xhr.onerror = () => { up.classList.add("hidden"); txt.classList.add("hidden"); toast("上传失败，试试直接填路径"); };
  xhr.send(file);
}

$("loadpath").addEventListener("click", () => {
  const p = $("path").value.trim().replace(/^"|"$/g, "");
  if(!p) return toast("先填一个视频路径");
  analyze(p);
});
$("path").addEventListener("keydown", e => { if(e.key === "Enter") $("loadpath").click(); });

/* ---------- 分析 ---------- */
async function analyze(path){
  try{
    const d = await api("/api/analyze", {path});
    current = d.info;
    renderInfo(current);
    $("infoCard").classList.remove("hidden");
    $("actCard").classList.remove("hidden");
    updatePreview();
    $("infoCard").scrollIntoView({behavior:"smooth", block:"start"});
  }catch(e){ toast(e.message); }
}

function renderInfo(info){
  const v = info.video, a = info.audio, dur = info.duration || 0;
  const vb = v ? (v.bytes || 0) : 0;
  const vShare = info.size ? (vb / info.size * 100) : 0;
  const kpis = [
    ["体积", fmtBytes(info.size), info.size.toLocaleString("zh-CN") + " 字节"],
    ["时长", fmtDur(dur), `${dur.toFixed(2)} 秒`],
    ["分辨率", v ? `${Math.round(v.width||0)}×${Math.round(v.height||0)}` : "—",
      v ? (v.height > v.width ? "竖屏" : "横屏") : ""],
    ["帧率", v && v.fps ? v.fps.toFixed(2) + " fps" : "—", v && v.width ? bppTag(info) : ""],
    ["视频码率", v ? fmtBps(v.bps) : "—", `占总体积 ${vShare.toFixed(1)}%`],
    ["视频编码", v ? (v.codec || "?") : "—", v ? (v.profile || v.sample_entry || "") : ""],
    ["音频", a ? `${a.codec || "?"} ${a.channels || 0}ch` : "无音轨",
      a ? `${fmtBps(a.bps)} / ${Math.round((a.sample_rate||0)/1000)}kHz` : ""],
    ["封装开销", fmtBytes(info.overhead), (info.moov_first === false ? "moov 在后" : "moov 在前")],
  ];
  $("kpis").innerHTML = kpis.map(([k, val, sub]) =>
    `<div class="kpi"><i>${esc(k)}</i><b>${esc(val)}</b><small>${esc(sub || "")}</small></div>`).join("");

  const rows = info.tracks.map(t => {
    const kind = t.kind === "video" ? '<span class="pill video">视频</span>'
               : t.kind === "audio" ? '<span class="pill audio">音频</span>'
               : `<span class="pill">${esc(t.kind)}</span>`;
    const spec = t.kind === "video"
      ? `${Math.round(t.width||0)}×${Math.round(t.height||0)} @ ${(t.fps||0).toFixed(2)}fps`
      : t.kind === "audio" ? `${t.channels||0} 声道 ${Math.round((t.sample_rate||0)/1000)}kHz` : "—";
    return `<tr><td>${kind}</td><td>${esc(t.codec || "?")} <span class="unit">${esc(t.profile||"")}</span></td>
      <td>${esc(spec)}</td><td class="num">${fmtBytes(t.bytes)}</td><td class="num">${fmtBps(t.bps)}</td>
      <td class="num">${fmtDur(t.duration)}</td></tr>`;
  }).join("");
  $("tracks").innerHTML = `<tr><th>类型</th><th>编码</th><th>规格</th><th>大小</th><th>码率</th><th>时长</th></tr>` + rows;

  const notes = [];
  if(info.moov_first === false)
    notes.push(`<div><b>moov 在文件尾部</b>：网页播放器要下完整个文件才能开始，用「无损提取」重封装一次即可修正（体积不变）。</div>`);
  if(v && v.bps && v.bps > 4e6)
    notes.push(`<div class="info">视频码率 ${fmtBps(v.bps)} 偏高：这是导出档位决定的，不是素材本身。压缩空间通常很大。</div>`);
  if(v && v.bpp && v.bpp < 0.03)
    notes.push(`<div class="info">bpp ≈ ${v.bpp.toFixed(3)}（每像素每帧比特数）偏低，说明画面简单，进一步压缩对观感影响有限。</div>`);
  if(a && a.bps && a.bps < 16000 && dur > 0){
    const waste = (128000 - (a.bps||0)) / 8 * dur;
    if(waste > 1024 * 1024)
      notes.push(`<div>音轨只有 ${fmtBps(a.bps)}（近乎静音）。按 128kbps 重新编码会白白多出约 ${fmtBytes(waste)}，压缩时建议选 32kbps 或去掉音轨。</div>`);
  }
  if(info.encoder_strings && info.encoder_strings.length)
    notes.push(`<div class="info">编码器标记：${esc(info.encoder_strings.join(" · "))}</div>`);
  $("notes").innerHTML = notes.join("");
}

function bppTag(info){
  return info.bpp ? "bpp " + info.bpp.toFixed(3) : "";
}

/* ---------- 操作面板 ---------- */
let mode = "size", tab = "shrink";

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  tab = b.dataset.tab;
  $("panelShrink").classList.toggle("hidden", tab !== "shrink");
  $("panelExtract").classList.toggle("hidden", tab !== "extract");
  updatePreview();
}));

document.querySelectorAll("#modeSeg button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b));
  mode = b.dataset.mode;
  $("sizeLabel").classList.toggle("hidden", mode !== "size");
  $("sizeRow").classList.toggle("hidden", mode !== "size");
  $("crfLabel").classList.toggle("hidden", mode !== "crf");
  $("crfRow").classList.toggle("hidden", mode !== "crf");
  updatePreview();
}));

$("crf").addEventListener("input", () => {
  const v = +$("crf").value;
  $("crfVal").textContent = v;
  $("crfHint").textContent = v <= 20 ? "接近原始画质" : v <= 24 ? "观感很好" : v <= 27 ? "能看出压缩" : "体积优先";
  updatePreview();
});
["targetMb","codec","height","audioKbps","noAudio","preset","extractNoAudio","outDirInput"]
  .forEach(id => $(id).addEventListener("input", updatePreview));

function currentOutDir(){
  return ($("outDirInput").value || "").trim().replace(/^"|"$/g, "").replace(/[\\/]+$/, "") || $("outdir").textContent || "out";
}

function updatePreview(){
  if(!current){ return; }
  const dir = currentOutDir();
  if(tab === "extract"){
    $("outPreview").textContent = "输出：" + dir + "\\" + baseName(current.path) + "_提取.mp4（体积基本不变）";
    $("startHint").textContent = "不重新编码，只重组封装";
    return;
  }
  const tag = mode === "size" ? (Math.round(+$("targetMb").value || 0) + "MB") : ("CRF" + $("crf").value);
  $("outPreview").textContent = "输出：" + dir + "\\" + baseName(current.path) + "_压缩_" + tag + ".mp4";
  $("startHint").textContent = mode === "size"
    ? `目标 ${(+$("targetMb").value || 0)} MB，实际通常更小`
    : "画质优先，体积由内容决定";
}
function baseName(p){ const s = p.split(/[\\/]/).pop(); return s.replace(/\.[^.]+$/, ""); }

/* ---------- 开始任务 ---------- */
$("start").addEventListener("click", async () => {
  if(!current) return toast("先选一个视频");
  const payload = {path: current.path, op: tab, out_dir: currentOutDir()};
  if(tab === "shrink"){
    Object.assign(payload, {
      mode, codec: $("codec").value, preset: $("preset").value,
      height: $("height").value === "0" ? null : +$("height").value,
      audio_kbps: +$("audioKbps").value, no_audio: $("noAudio").checked,
    });
    if(mode === "size") payload.target_mb = +$("targetMb").value;
    else payload.crf = +$("crf").value;
  }else{
    payload.no_audio = $("extractNoAudio").checked;
  }
  $("start").disabled = true;
  try{
    const d = await api("/api/job", payload);
    jobId = d.job.id;
    showJob(d.job);
    poll();
  }catch(e){
    toast(e.message);
  }finally{
    $("start").disabled = false;
  }
});

function showJob(job){
  $("jobCard").classList.remove("hidden");
  $("jobTitle").textContent = job.title + " · 处理中";
  $("bar").className = "bar";
  $("cancel").classList.remove("hidden");
  $("again").classList.add("hidden");
  $("resultBox").classList.add("hidden");
  $("jobLog").textContent = "";
  $("jobCard").scrollIntoView({behavior:"smooth", block:"center"});
  applyJob(job);
}

function applyJob(job){
  const p = job.progress == null ? 0 : job.progress;
  $("bar").firstElementChild.style.width = (p * 100).toFixed(1) + "%";
  const parts = [`<span>进度 <b>${(p*100).toFixed(1)}%</b></span>`];
  if(job.duration) parts.push(`<span>${fmtDur(job.done_seconds)} / ${fmtDur(job.duration)}</span>`);
  if(job.speed) parts.push(`<span>速度 <b>${job.speed.toFixed(2)}×</b></span>`);
  if(job.fps) parts.push(`<span>${job.fps.toFixed(0)} fps</span>`);
  parts.push(`<span>已用 <b>${job.elapsed.toFixed(0)}s</b></span>`);
  const eta = (p > 0.02 && p < 1) ? job.elapsed / p * (1 - p) : null;
  if(eta && isFinite(eta)) parts.push(`<span>预计还剩 <b>${eta.toFixed(0)}s</b></span>`);
  $("jobStat").innerHTML = parts.join("");

  const log = $("jobLog");
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  log.textContent = job.log.join("\n");
  if(stick) log.scrollTop = log.scrollHeight;

  if(job.status === "done"){
    $("bar").className = "bar done";
    $("bar").firstElementChild.style.width = "100%";
    $("jobTitle").textContent = job.title + " · 完成";
    $("cancel").classList.add("hidden");
    $("again").classList.remove("hidden");
    renderResult(job);
  }else if(job.status === "error" || job.status === "cancelled"){
    $("bar").className = "bar err";
    $("jobTitle").textContent = job.title + (job.status === "error" ? " · 失败" : " · 已取消");
    $("cancel").classList.add("hidden");
    $("again").classList.remove("hidden");
    if(job.error) toast(job.error);
  }
}

function renderResult(job){
  const oldSize = current ? current.size : null;
  const newSize = job.out_size;
  const box = $("resultBox");
  const saved = oldSize && newSize ? (1 - newSize / oldSize) * 100 : null;
  box.textContent = "";

  const sizes = document.createElement("div");
  sizes.className = "sizes";
  sizes.innerHTML = `<span class="old">${fmtBytes(oldSize)}</span>
    <span class="arrow">→</span>
    <span class="new">${fmtBytes(newSize)}</span>`;
  if(saved != null){
    const tag = document.createElement("span");
    tag.className = "saved";
    tag.textContent = (saved >= 0 ? "省了 " : "大了 ") + Math.abs(saved).toFixed(1) + "%";
    sizes.appendChild(tag);
  }

  const btns = document.createElement("div");
  btns.className = "row";
  btns.style.marginLeft = "auto";
  const dl = document.createElement("button");
  dl.className = "primary";
  dl.textContent = "下载";
  dl.onclick = () => { location.href = "/api/download?path=" + encodeURIComponent(job.out_path); };
  const rv = document.createElement("button");
  rv.className = "ghost";
  rv.textContent = "打开文件夹";
  rv.onclick = () => reveal(job.out_path);
  btns.appendChild(dl); btns.appendChild(rv);

  box.appendChild(sizes); box.appendChild(btns);
  box.classList.remove("hidden");
}

window.reveal = async (path) => {
  try{ await api("/api/reveal", {path}); }catch(e){ toast(e.message); }
};

$("cancel").addEventListener("click", async () => {
  if(!jobId) return;
  try{ await api("/api/cancel", {id: jobId}); }catch(e){ toast(e.message); }
});
$("again").addEventListener("click", () => {
  $("jobCard").classList.add("hidden");
  $("actCard").scrollIntoView({behavior:"smooth", block:"center"});
});

function poll(){
  clearInterval(timer);
  timer = setInterval(async () => {
    if(!jobId) return;
    try{
      const d = await api("/api/job?id=" + encodeURIComponent(jobId));
      applyJob(d.job);
      if(d.job.status !== "running" && d.job.status !== "queued") clearInterval(timer);
    }catch(e){ /* 轮询失败不打断 */ }
  }, 700);
}
</script>
</body>
