/* ════════════════ 图例与类型显隐 ════════════════ */

/* 会话内可见性有两层，取交集生效（不持久化）：
   ① 图例眼睛按类型隐藏——藏节点类型 = 该类型全部卡片 + 与之相连的全部连线；藏连线类型 = 只藏线不藏端点；
   ② 聚焦模式只保留种子节点及其全部连线对端。随语言切换 / 卡片重建 / 聚焦切换重放 */
const hiddenTypes = new Set(), hiddenKinds = new Set();
const FOCUS = { on: false, ids: new Set() };
const nodeVisible = n => !n || (!hiddenTypes.has(n.type) && (!FOCUS.on || FOCUS.ids.has(n.id)));
const edgeVisible = e => !hiddenKinds.has(edgeKindOf(e))
  && nodeVisible(nodeById(edgeNodeId(e, 'from'))) && nodeVisible(nodeById(edgeNodeId(e, 'to')));

function applyTypeVisibility() {
  NODES.forEach(n => { n.el.style.display = nodeVisible(n) ? '' : 'none'; });
  edges.forEach(e => { e.g.style.display = edgeVisible(e) ? '' : 'none'; });
}

/* 聚焦：保留 id 及其所有连线对端（不限连线类型 / 方向 / 锚点形式），其余节点隐藏；
   只剩可见两端点的连线随 edgeVisible 一同隐藏。fitView 只框可见集，正好把子图拉近 */
function setFocus(id) {
  FOCUS.ids = new Set([id]);
  edges.forEach(e => {
    const a = edgeNodeId(e, 'from'), b = edgeNodeId(e, 'to');
    if (a === id && b) FOCUS.ids.add(b);
    if (b === id && a) FOCUS.ids.add(a);
  });
  FOCUS.on = true;
  applyTypeVisibility();
  $('#btn-show-all').hidden = false;
  fitView();
  toast(fmt('focusedToast', { t: shortTitle(nodeById(id)), n: FOCUS.ids.size }));
}

function clearFocus() {
  if (!FOCUS.on) return;
  FOCUS.on = false;
  FOCUS.ids.clear();
  applyTypeVisibility();
  $('#btn-show-all').hidden = true;
  toast(L('showAllToast'));
}

const ICON_EYE = `<svg viewBox="0 0 16 16" fill="none"><path d="M1.8 8S4.3 3.9 8 3.9 14.2 8 14.2 8 11.7 12.1 8 12.1 1.8 8 1.8 8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg>`;
const ICON_EYE_OFF = `<svg viewBox="0 0 16 16" fill="none"><path d="M1.8 8S4.3 3.9 8 3.9 14.2 8 14.2 8 11.7 12.1 8 12.1 1.8 8 1.8 8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M3.4 12.6 12.6 3.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;

function lgItem(markup, label, group, key) {
  const off = (group === 'type' ? hiddenTypes : hiddenKinds).has(key);
  return `<span class="lg-item${off ? ' off' : ''}">${markup}<span class="lg-label">${esc(label)}</span><button class="lg-eye" type="button" data-group="${group}" data-key="${esc(key)}">${off ? ICON_EYE_OFF : ICON_EYE}</button></span>`;
}

function toggleLegendVis(group, key) {
  const set = group === 'type' ? hiddenTypes : hiddenKinds;
  set.has(key) ? set.delete(key) : set.add(key);
  applyTypeVisibility();
  const btn = $(`.lg-eye[data-group="${group}"][data-key="${CSS.escape(key)}"]`);
  if (btn) {
    const off = set.has(key);
    btn.closest('.lg-item').classList.toggle('off', off);
    btn.innerHTML = off ? ICON_EYE_OFF : ICON_EYE;
  }
  updateLgAllBtns();   /* 手动藏到最后一个 / 恢复第一个时，按钮文案随之切换 */
}

/* 类别键集与隐藏集 */
const lgKeysOf = group => group === 'type' ? Object.keys(TYPES) : Object.keys(EDGE_KINDS);
const lgSetOf = group => group === 'type' ? hiddenTypes : hiddenKinds;

/* 「全部隐藏 / 全部显示」按钮文案随类别状态切换：
   类别内全部对象都已隐藏（无论经由按钮还是逐个眼睛）→ 全部显示；否则 → 全部隐藏 */
function updateLgAllBtns() {
  document.querySelectorAll('#lg-body .lg-all').forEach(b => {
    const keys = lgKeysOf(b.dataset.group), set = lgSetOf(b.dataset.group);
    b.textContent = keys.every(k => set.has(k)) ? L('showAll') : L('hideAll');
  });
}

/* 类别级一键切换：全部已藏 → 全部显示；否则 → 全部隐藏（重建图例同步所有眼睛图标） */
function toggleAllOfGroup(group) {
  const keys = lgKeysOf(group), set = lgSetOf(group);
  const allHidden = keys.every(k => set.has(k));
  keys.forEach(k => allHidden ? set.delete(k) : set.add(k));
  applyTypeVisibility();
  buildLegend();
}

/* 图例（随界面语言重建） */
function buildLegend() {
  $('#lg-types').innerHTML = Object.keys(TYPES)
    .map(k => lgItem(`<i style="background:${TYPES[k].color}"></i>`, typeLabel(k), 'type', k)).join('');
  $('#lg-edges').innerHTML = Object.entries(EDGE_KINDS).map(([key, kd]) => {
    let swatch;
    if (key === 'implements') {
      /* 宽条线样：与画布一致的双侧实线 + 半透明渐变填充 + 内部流动细线 */
      swatch = `<svg width="26" height="12"><defs><linearGradient id="lg-impl-g" gradientUnits="userSpaceOnUse" x1="1" y1="0" x2="25" y2="0"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="lg-impl-s" gradientUnits="userSpaceOnUse" x1="6" y1="0" x2="20" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="1" y="3.5" width="24" height="5" fill="url(#lg-impl-g)" fill-opacity=".3"/><path d="M1 3.5h24" stroke="url(#lg-impl-g)" stroke-width="1.4"/><path d="M1 8.5h24" stroke="url(#lg-impl-g)" stroke-width="1.4"/><path d="M6 6h14" stroke="url(#lg-impl-s)" stroke-width="1.8" stroke-linecap="round"/></svg>`;
    } else if (key === 'call' || kd.anim === 'dots') {
      swatch = `<svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="${kd.color || '#64748b'}" stroke-width="1.6" stroke-opacity=".55"/><circle cx="9" cy="5" r="2" fill="${kd.color || '#64748b'}"/><circle cx="18" cy="5" r="2" fill="${kd.color || '#64748b'}"/></svg>`;
    } else {
      swatch = `<svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="${kd.color}" stroke-width="1.8" stroke-dasharray="${kd.dash}" stroke-linecap="round"/></svg>`;
    }
    return lgItem(swatch, edgeLabel(key), 'edge', key);
  }).join('');
  updateLgAllBtns();
}

/* 静态 UI 文案（随界面语言刷新） */

/* 切换语言：UI 文本立即刷新；图谱数据按 tV 取对应语言（数据缺该语言时保持原语言并提示） */
function applyLanguage(lang) {
  if (lang === LNG.cur) return;
  LNG.cur = lang;
  try { localStorage.setItem('codegraph-ui-lang', lang); } catch (e) { /* 忽略 */ }
  const sel = selectedNode;
  NODES.forEach(n => {
    const was = n === sel;
    n.el.remove();
    renderNode(n);
    if (was) { selectedNode = n; n.el.classList.add('selected'); }
  });
  edges.forEach(e => { if (e.labelEl) e.labelEl.textContent = tV(e.label) || edgeLabel(e.kind); });
  updateAllEdges();
  applyTypeVisibility();   /* 重建的卡片要重新套用图例眼睛的隐藏状态 */
  buildLegend();
  applyUiTexts();
  SEARCH_CORPUS = buildSearchCorpus();
  renderTree();
  if (selectedNode) showInspector(selectedNode);
  hidePopover(); hideEdgeTip();
  if (!LNG.avail.has(lang)) toast(L('langMiss'));
}
document.querySelectorAll('.lang-sw button').forEach(b =>
  b.addEventListener('click', () => applyLanguage(b.dataset.l)));

/* 深 / 浅色主题切换：颜色全部走 CSS 变量，切 data-theme 即全量生效；
   记忆到 localStorage，首次访问跟随系统偏好（<head> 引导脚本已落初值） */
$('#btn-theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;

  $('#btn-theme').title = next === 'dark' ? L('themeLight') : L('themeDark');
});

/* 聚焦模式的工具栏退出入口（另一入口：画布空白处右键「显示全部节点」） */

$('#lg-toggle').addEventListener('click', () => $('#legend').classList.toggle('collapsed'));
/* 图例内眼睛开关与类别级一键显隐：事件委托，语言切换重建图例后依然生效 */
$('#lg-body').addEventListener('click', e => {
  const all = e.target.closest('.lg-all');

  if (btn) toggleLegendVis(btn.dataset.group, btn.dataset.key);
});
/* 图例位于画布容器内，阻断指针/滚轮冒泡，避免拖动图例平移画布、滚轮缩放画布 */
['pointerdown', 'wheel'].forEach(evt =>
  $('#legend').addEventListener(evt, e => e.stopPropagation()));

buildLegend();
applyUiTexts();
/* 窄视口（≤720px）：文件面板浮层化后默认收起，画布占满宽度；可经左上角 » 按钮唤出 */
if (matchMedia('(max-width: 720px)').matches) setFilePanel(true, false);
loadSampleProject();
SEARCH_CORPUS = buildSearchCorpus();
NODES.forEach(renderNode);
/* 节点渲染完成（初始宽统一 270），此刻的几何即「生成时布局」基线 */
NODES.forEach(n => { ORIG_LAYOUT[n.id] = { x: n.x, y: n.y, w: n.w }; });

/* 沿用用户保存的布局 */
try {
  const saved = localStorage.getItem(LS_KEY);
  if (saved) applyLayout(JSON.parse(saved));
} catch (e) { /* 忽略损坏数据 */ }

edges.forEach(renderEdge);
applyTypeVisibility();   /* 初始全显；统一入口，保证后续重放路径一致 */
applyView();
/* 首帧定位：rAF 与定时器在被遮挡/未合成的 webview 中可能被暂停或节流，
   兜底用重试链（每 400ms 再试，成功一次即停；正常浏览器首帧 rAF 即完成，后续重试空转） */
let initialFitDone = false;
const initialFit = () => { if (initialFitDone) return; initialFitDone = true; updateAllEdges(); fitView(); };
const initialFitRetry = () => { if (initialFitDone) return; setTimeout(() => { initialFit(); initialFitRetry(); }, 400); };
requestAnimationFrame(initialFit);
initialFitRetry();
requestAnimationFrame(animateDots);
</script>
</body>
</html>
